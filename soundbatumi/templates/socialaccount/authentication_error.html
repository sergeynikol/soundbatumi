{% extends "base.html" %}
{% load static i18n %}

{% block title %}{% trans "Authentication Error" %}{% endblock %}

{% block content %}
<section id="hero" class="d-flex align-items-center justify-content-center" style="min-height: 80vh;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="icon-box" style="background: rgba(255, 255, 255, 0.9); padding: 40px; border-radius: 10px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);">
          <h2 class="text-center mb-4" style="color: #124265;">{% trans "Authentication Error" %}</h2>
          
          <div class="alert alert-danger">
            <h4>{% trans "An error occurred during authentication" %}</h4>
            <p>{{ auth_error }}</p>
          </div>

          <div class="text-center mt-4">
            <a href="/" class="auth-submit-btn" style="display: inline-block; text-decoration: none; color: white;">
              <span>{% trans "Back to Home" %}</span>
              <i class="bi bi-arrow-left"></i>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
