{% load static i18n %}

<!-- Checkout Modal -->
<div class="modal fade" id="checkoutModal" tabindex="-1" role="dialog" aria-labelledby="checkoutModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
    <div class="modal-content checkout-modal-content">
      <div class="modal-header checkout-modal-header">
        <h5 class="modal-title" id="checkoutModalLabel">
          <i class="bi bi-clipboard-check"></i> {% trans "Checkout" %}
        </h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <form id="checkoutForm">
        {% csrf_token %}
        <div class="modal-body checkout-modal-body">
          <div id="checkoutError" class="alert alert-danger" style="display: none;"></div>
          <div id="checkoutSuccess" class="alert alert-success" style="display: none;"></div>
          
          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label for="customerName">
                  <i class="bi bi-person"></i> {% trans "Name" %} <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control checkout-input" id="customerName" name="customer_name" required placeholder="{% trans 'Enter your name' %}">
              </div>
            </div>
            
            <div class="col-md-6">
              <div class="form-group">
                <label for="customerPhone">
                  <i class="bi bi-telephone"></i> {% trans "Phone" %} <span class="text-danger">*</span>
                </label>
                <input type="tel" class="form-control checkout-input" id="customerPhone" name="customer_phone" required placeholder="+995 XXX XXX XXX">
              </div>
            </div>
          </div>
          
          <div class="form-group">
            <label for="customerEmail">
              <i class="bi bi-envelope"></i> {% trans "Email" %}
            </label>
            <input type="email" class="form-control checkout-input" id="customerEmail" name="customer_email" placeholder="example@email.com">
          </div>
          
          <div class="form-group">
            <label for="deliveryAddress">
              <i class="bi bi-geo-alt"></i> {% trans "Delivery Address" %} <span class="text-danger">*</span>
            </label>
            <textarea class="form-control checkout-input" id="deliveryAddress" name="delivery_address" rows="3" required placeholder="{% trans 'Enter full delivery address' %}"></textarea>
            <small class="form-text text-muted">
              <i class="bi bi-info-circle"></i> {% trans "Specify the delivery location" %}
            </small>
          </div>
          
          <div class="row">
            <div class="col-md-6">
              <div class="form-group">
                <label for="installationDate">
                  <i class="bi bi-calendar-event"></i> {% trans "Installation Date" %} <span class="text-danger">*</span>
                </label>
                <input type="date" class="form-control checkout-input" id="installationDate" name="installation_date" required min="">
                <small class="form-text text-muted">
                  <i class="bi bi-info-circle"></i> {% trans "Select the date for order installation" %}
                </small>
              </div>
            </div>
            
            <div class="col-md-6">
              <div class="form-group">
                <label for="installationTime">
                  <i class="bi bi-clock"></i> {% trans "Installation Time" %} <span class="text-danger">*</span>
                </label>
                <input type="time" class="form-control checkout-input" id="installationTime" name="installation_time" required>
                <small class="form-text text-muted">
                  <i class="bi bi-info-circle"></i> {% trans "Select the start time for installation" %}
                </small>
              </div>
            </div>
          </div>
          
          <div class="form-group">
            <label for="customerComment">
              <i class="bi bi-chat-left-text"></i> {% trans "Order Comment" %}
            </label>
            <textarea class="form-control checkout-input" id="customerComment" name="customer_comment" rows="3" placeholder="{% trans 'Additional information (optional)' %}"></textarea>
          </div>
          
          <div class="checkout-summary">
            <div class="summary-header">
              <i class="bi bi-receipt-cutoff"></i> {% trans "Total Amount" %}
            </div>
            <div class="summary-amount">
              <span id="checkoutTotal">0.00</span> <span class="currency">₾</span>
            </div>
          </div>
        </div>
        <div class="modal-footer checkout-modal-footer">
          <button type="button" class="btn btn-secondary checkout-btn-cancel" data-dismiss="modal">
            <i class="bi bi-x-circle"></i> {% trans "Cancel" %}
          </button>
          <button type="submit" class="btn btn-primary checkout-btn-submit" id="submitOrderBtn">
            <i class="bi bi-check-circle"></i> {% trans "Confirm Order" %}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
// Устанавливаем минимальную дату и валидацию времени для полей монтажа
document.addEventListener('DOMContentLoaded', function() {
  const installationDateInput = document.getElementById('installationDate');
  const installationTimeInput = document.getElementById('installationTime');
  
  if (installationDateInput) {
    // Устанавливаем минимальную дату (сегодня)
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const day = String(today.getDate()).padStart(2, '0');
    const minDate = `${year}-${month}-${day}`;
    installationDateInput.setAttribute('min', minDate);
    
    // Обработчик изменения даты для проверки времени
    installationDateInput.addEventListener('change', function() {
      validateInstallationDateTime();
    });
  }
  
  if (installationTimeInput) {
    // Обработчик изменения времени
    installationTimeInput.addEventListener('change', function() {
      validateInstallationDateTime();
    });
  }
  
  function validateInstallationDateTime() {
    if (!installationDateInput || !installationTimeInput) return;
    
    const selectedDate = installationDateInput.value;
    const selectedTime = installationTimeInput.value;
    
    if (selectedDate && selectedTime) {
      const today = new Date();
      const selected = new Date(selectedDate + 'T' + selectedTime);
      
      // Если выбрана сегодняшняя дата, проверяем, что время не в прошлом
      if (selectedDate === installationDateInput.getAttribute('min')) {
        const now = new Date();
        if (selected <= now) {
          // Устанавливаем минимальное время (текущее время + 1 час для удобства)
          const minTime = new Date(now.getTime() + 60 * 60 * 1000); // +1 час
          const hours = String(minTime.getHours()).padStart(2, '0');
          const minutes = String(minTime.getMinutes()).padStart(2, '0');
          const minTimeStr = `${hours}:${minutes}`;
          
          // Если выбранное время в прошлом, предупреждаем пользователя
          if (selected <= now) {
            installationTimeInput.setCustomValidity(
              '{% trans "Please select a time in the future" %}'
            );
            // Автоматически устанавливаем время на час вперед
            installationTimeInput.value = minTimeStr;
          } else {
            installationTimeInput.setCustomValidity('');
          }
        } else {
          installationTimeInput.setCustomValidity('');
        }
      } else {
        installationTimeInput.setCustomValidity('');
      }
    }
  }
  
  // Валидация при открытии модального окна
  const checkoutModal = document.getElementById('checkoutModal');
  if (checkoutModal) {
    checkoutModal.addEventListener('shown.bs.modal', function() {
      validateInstallationDateTime();
    });
  }
});
</script>
