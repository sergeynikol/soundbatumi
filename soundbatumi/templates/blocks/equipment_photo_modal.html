{% load static %}

<!-- Equipment Photo Modal -->
<div class="modal fade" id="equipmentPhotoModal" tabindex="-1" role="dialog" aria-labelledby="equipmentPhotoModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
    <div class="modal-content equipment-photo-modal-content">
      <div class="modal-header equipment-photo-modal-header">
        <h5 class="modal-title" id="equipmentPhotoModalLabel">
          <i class="bi bi-image"></i> <span id="equipmentPhotoTitle">Фото товара</span>
        </h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body equipment-photo-modal-body">
        <div class="equipment-photo-main-wrapper">
          <img id="equipmentPhotoMain" src="" alt="" class="equipment-photo-main">
        </div>
        <div class="equipment-photo-thumbnails-modal" id="equipmentPhotoThumbnails">
          <!-- Миниатюры будут добавлены через JavaScript -->
        </div>
      </div>
    </div>
  </div>
</div>
