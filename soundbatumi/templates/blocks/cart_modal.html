{% load static i18n %}

<!-- Cart Modal -->
<div class="modal fade" id="cartModal" tabindex="-1" role="dialog" aria-labelledby="cartModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
    <div class="modal-content cart-modal-content">
      <div class="modal-header cart-modal-header">
        <h5 class="modal-title" id="cartModalLabel">
          <i class="bi bi-cart3"></i> {% trans "Shopping Cart" %}
        </h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body cart-modal-body">
        <div id="cartItems" class="cart-items-list">
          <div class="cart-empty-message">
            <i class="bi bi-cart-x"></i>
            <p>{% trans "Cart is empty" %}</p>
          </div>
        </div>
      </div>
      <div class="modal-footer cart-modal-footer">
        <div class="cart-total">
          <strong>{% trans "Total" %}: <span id="cartTotal">0</span> ₾</strong>
        </div>
        <button type="button" class="btn btn-secondary" id="continueShoppingBtn" data-dismiss="modal">{% trans "Continue Shopping" %}</button>
        <button type="button" class="btn btn-primary" id="checkoutBtn" disabled>{% trans "Checkout" %}</button>
      </div>
    </div>
  </div>
</div>
