{% load static wagtailcore_tags i18n %}
<li><i class="bx bx-chevron-right"></i> <a href="#" data-toggle="modal" data-target="#mapModal">{% trans "Pick-up point" %}</a></li>

<div class="modal fade" id="mapModal" tabindex="-1" role="dialog" aria-labelledby="mapModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="mapModalLabel">Google Карта</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <iframe src="https://www.google.com/maps/d/embed?mid=1BXM-eRo_b4IGCHfC1HvuECFcHt3eEic&hl=ru&ehbc=2E312F" width="100%" height="450" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
                </div>
            </div>
        </div>
    </div>

{% for link in links %}
        <li><i class="bx bx-chevron-right"></i> <a href={{link.url_posicion}}>{{link.text_link}}</a></li>
{% endfor %}
