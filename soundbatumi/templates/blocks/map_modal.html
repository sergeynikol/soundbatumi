{% load static i18n %}

<!-- ======= Map Modal ======= -->
<div class="modal fade" id="mapModal" tabindex="-1" role="dialog" aria-labelledby="mapModalLabel" aria-hidden="true" data-backdrop="true" data-keyboard="true">
  <div class="modal-dialog modal-xl map-modal-dialog" role="document">
    <div class="modal-content map-modal-content">
      <div class="modal-header map-modal-header">
        <h5 class="modal-title" id="mapModalLabel">
          <i class="bx bx-map"></i>
          {% trans "Pick-up point" %}
        </h5>
        <button type="button" class="close map-modal-close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body map-modal-body">
        <iframe src="https://www.google.com/maps/d/embed?mid=1BXM-eRo_b4IGCHfC1HvuECFcHt3eEic&hl=ru&ehbc=2E312F" width="100%" height="600" style="border:0; border-radius: 8px;" allowfullscreen="" loading="lazy"></iframe>
      </div>
    </div>
  </div>
</div>
